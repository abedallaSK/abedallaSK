name: Update profile cards

on:
  schedule:
    - cron: "0 3 * * *" # daily
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/**, .github/workflows/profile-cards.yml]

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate cards
        env:
          # Add a STATS_TOKEN secret (personal token with repo scope) to include private repositories.
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN || github.token }}
          INCLUDE_PRIVATE: ${{ secrets.STATS_TOKEN && '1' || '0' }}
        run: node scripts/generate.mjs
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          if ! git diff --cached --quiet; then git commit -m "Update profile cards" && git push; fi
